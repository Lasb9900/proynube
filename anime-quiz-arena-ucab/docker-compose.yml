version: "3.9"

services:
  api-gateway:
    build: ./gateway
    ports:
      - "50050:50050"
      - "8080:8080"
    environment:
      - PORT=8080
      - GRPC_PORT=50050
      - USERS_SERVICE_ADDR=users-service:50051
      - QUESTIONS_SERVICE_ADDR=questions-service:50052
      - GAME_ROOM_SERVICE_ADDR=game-room-service:50053
      - SCORE_SERVICE_ADDR=score-service:50054
      - LIVE_EVENTS_SERVICE_ADDR=live-events-service:50055
    depends_on:
      - users-service
      - questions-service
      - game-room-service
      - score-service
      - live-events-service

  users-service:
    build: ./services/users-service
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - DATABASE_URL=postgres://postgres:postgres@users-db:5432/users_db
    depends_on:
      - users-db

  questions-service:
    build: ./services/questions-service
    ports:
      - "50052:50052"
    environment:
      - GRPC_PORT=50052
      - JIKAN_BASE_URL=https://api.jikan.moe/v4

  game-room-service:
    build: ./services/game-room-service
    ports:
      - "50053:50053"
    environment:
      - GRPC_PORT=50053
      - DATABASE_URL=postgres://postgres:postgres@rooms-db:5432/rooms_db
      - SCORE_SERVICE_ADDR=score-service:50054
    depends_on:
      - rooms-db
      - score-service

  score-service:
    build: ./services/score-service
    ports:
      - "50054:50054"
    environment:
      - GRPC_PORT=50054
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  live-events-service:
    build: ./services/live-events-service
    ports:
      - "50055:50055"
    environment:
      - GRPC_PORT=50055

  users-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=users_db
    ports:
      - "5433:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data

  rooms-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rooms_db
    ports:
      - "5434:5432"
    volumes:
      - rooms-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  users-db-data:
  rooms-db-data:
  redis-data:
