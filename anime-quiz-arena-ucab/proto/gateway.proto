syntax = "proto3";
package animequiz.gateway.v1;

service GatewayService {
  rpc CreateUser(GatewayCreateUserRequest) returns (GatewayUserResponse);
  rpc LoginBasic(GatewayLoginRequest) returns (GatewayLoginResponse);

  rpc SearchAnime(GatewaySearchAnimeRequest) returns (GatewaySearchAnimeResponse);
  rpc GenerateQuestion(GatewayGenerateQuestionRequest) returns (GatewayGenerateQuestionResponse);

  rpc CreateRoom(GatewayCreateRoomRequest) returns (GatewayRoomResponse);
  rpc JoinRoom(GatewayJoinRoomRequest) returns (GatewayRoomResponse);
  rpc StartGame(GatewayRoomIdRequest) returns (GatewayRoomResponse);
  rpc EndGame(GatewayRoomIdRequest) returns (GatewayRoomResponse);

  rpc SubmitAnswer(GatewaySubmitAnswerRequest) returns (GatewaySubmitAnswerResponse);
  rpc GetRoomState(GatewayRoomStateRequest) returns (GatewayRoomStateResponse);

  rpc GetLeaderboard(GatewayLeaderboardRequest) returns (GatewayLeaderboardResponse);
}

message GatewayUser {
  string id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}

message GatewayUserResponse { GatewayUser user = 1; }
message GatewayCreateUserRequest { string username = 1; string email = 2; string password = 3; }

message GatewayLoginRequest { string email = 1; string password = 2; }
message GatewayLoginResponse { bool success = 1; GatewayUser user = 2; }

message GatewayAnime {
  int32 id = 1;
  string title = 2;
  string synopsis = 3;
  int32 episodes = 4;
  double score = 5;
  string image_url = 6;
}

message GatewaySearchAnimeRequest { string query = 1; }
message GatewaySearchAnimeResponse { repeated GatewayAnime animes = 1; }

message GatewayQuestion {
  string id = 1;
  string text = 2;
  string option_a = 3;
  string option_b = 4;
  string option_c = 5;
  string option_d = 6;
  string correct_option = 7;
  int32 anime_id = 8;
}

message GatewayGenerateQuestionRequest { string room_id = 1; }
message GatewayGenerateQuestionResponse { GatewayQuestion question = 1; }

message GatewayRoom {
  string id = 1;
  string name = 2;
  string status = 3;
  string created_by = 4;
  string created_at = 5;
}

message GatewayCreateRoomRequest { string name = 1; string created_by = 2; }
message GatewayJoinRoomRequest { string room_id = 1; string user_id = 2; string username = 3; }
message GatewayRoomIdRequest { string room_id = 1; }
message GatewayRoomResponse { GatewayRoom room = 1; }

message GatewaySubmitAnswerRequest {
  string room_id = 1;
  string user_id = 2;
  string question_id = 3;
  string selected_option = 4;
  string correct_option = 5;
}
message GatewaySubmitAnswerResponse {
  bool correct = 1;
  int32 points_awarded = 2;
  int32 total_points = 3;
  string message = 4;
}

message GatewayRoomStateRequest {
  string room_id = 1;
  string current_question_id = 2;
}

message GatewayRoomPlayer {
  string user_id = 1;
  string username = 2;
  bool answered_current_question = 3;
  bool ready = 4;
  string joined_at = 5;
}

message GatewayRoomStateResponse {
  GatewayRoom room = 1;
  repeated GatewayRoomPlayer players = 2;
  int32 total_players = 3;
  int32 answered_count = 4;
  bool all_answered = 5;
}

message GatewayScoreEntry { string user_id = 1; int32 points = 2; int32 rank = 3; }
message GatewayLeaderboardRequest { string room_id = 1; int32 limit = 2; }
message GatewayLeaderboardResponse { repeated GatewayScoreEntry entries = 1; }
