services:
  - type: web
    name: api-gateway
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: gateway/Dockerfile
    dockerContext: gateway
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50050"
      - key: USERS_SERVICE_ADDR
        value: https://users-service-5iow.onrender.com
      - key: QUESTIONS_SERVICE_ADDR
        value: https://questions-service-mten.onrender.com
      - key: GAME_ROOM_SERVICE_ADDR
        value: https://game-room-service.onrender.com
      - key: SCORE_SERVICE_ADDR
        value: https://score-service-lk5b.onrender.com
      - key: LIVE_EVENTS_SERVICE_ADDR
        value: https://live-events-service.onrender.com

  - type: web
    name: users-service
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: services/users-service/Dockerfile
    dockerContext: services/users-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50051"
      - key: USERS_GRPC_PORT
        value: "50051"
      - key: DATABASE_URL
        fromDatabase:
          name: users-db
          property: connectionString

  - type: web
    name: questions-service
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: services/questions-service/Dockerfile
    dockerContext: services/questions-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50052"
      - key: QUESTIONS_GRPC_PORT
        value: "50052"
      - key: QUESTIONS_SERVICE_ADDR
        value: 0.0.0.0:50052
      - key: JIKAN_BASE_URL
        value: https://api.jikan.moe/v4

  - type: web
    name: game-room-service
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: services/game-room-service/Dockerfile
    dockerContext: services/game-room-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50053"
      - key: GAME_ROOM_GRPC_PORT
        value: "50053"
      - key: DATABASE_URL
        fromDatabase:
          name: rooms-db
          property: connectionString
      - key: SCORE_SERVICE_ADDR
        value: https://score-service-lk5b.onrender.com

  - type: web
    name: score-service
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: services/score-service/Dockerfile
    dockerContext: services/score-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50054"
      - key: SCORE_GRPC_PORT
        value: "50054"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: score-redis
          property: connectionString

  - type: web
    name: live-events-service
    runtime: docker
    rootDir: anime-quiz-arena-ucab
    dockerfilePath: services/live-events-service/Dockerfile
    dockerContext: services/live-events-service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GRPC_PORT
        value: "50055"
      - key: LIVE_EVENTS_GRPC_PORT
        value: "50055"

  - type: keyvalue
    name: score-redis
    plan: free
    ipAllowList: []

  - type: web
    name: web
    runtime: static
    rootDir: anime-quiz-arena-ucab/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api-gateway-cwji.onrender.com

databases:
  - name: users-db
    plan: free
    databaseName: users_db
    user: users_db_user

  - name: rooms-db
    plan: free
    databaseName: rooms_db
    user: rooms_db_user
