syntax = "proto3";
package animequiz.questions.v1;
message Anime{int32 id=1; string title=2; string synopsis=3; int32 episodes=4; double score=5; string image_url=6;}
message Question{string id=1; string text=2; string option_a=3; string option_b=4; string option_c=5; string option_d=6; string correct_option=7; int32 anime_id=8;}
message SearchAnimeRequest{string query=1;} message SearchAnimeResponse{repeated Anime animes=1;}
message GetAnimeByIdRequest{int32 id=1;} message GetAnimeByIdResponse{Anime anime=1;}
message GenerateQuestionRequest{string room_id=1;} message GenerateQuestionResponse{Question question=1;}
service QuestionsService{rpc SearchAnime(SearchAnimeRequest) returns (SearchAnimeResponse); rpc GetAnimeById(GetAnimeByIdRequest) returns (GetAnimeByIdResponse); rpc GenerateQuestion(GenerateQuestionRequest) returns (GenerateQuestionResponse);}