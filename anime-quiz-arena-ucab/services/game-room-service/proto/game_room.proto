syntax = "proto3";
package animequiz.gameroom.v1;

message Room {
  string id = 1;
  string name = 2;
  string status = 3;
  string created_by = 4;
  string created_at = 5;
}

message CreateRoomRequest {
  string name = 1;
  string created_by = 2;
}

message CreateRoomResponse {
  Room room = 1;
}

message JoinRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message JoinRoomResponse {
  Room room = 1;
}

message StartGameRequest {
  string room_id = 1;
}

message StartGameResponse {
  Room room = 1;
}

message EndGameRequest {
  string room_id = 1;
}

message EndGameResponse {
  Room room = 1;
}

message SubmitAnswerRequest {
  string room_id = 1;
  string user_id = 2;
  string question_id = 3;
  string selected_option = 4;
  string correct_option = 5;
}

message SubmitAnswerResponse {
  bool correct = 1;
  int32 points_awarded = 2;
  int32 total_points = 3;
  string message = 4;
}

message GetRoomStateRequest {
  string room_id = 1;
  string current_question_id = 2;
}

message RoomPlayer {
  string user_id = 1;
  bool answered_current_question = 2;
  bool ready = 3;
  string joined_at = 4;
}

message GetRoomStateResponse {
  Room room = 1;
  repeated RoomPlayer players = 2;
  int32 total_players = 3;
  int32 answered_count = 4;
  bool all_answered = 5;
}

service GameRoomService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc StartGame(StartGameRequest) returns (StartGameResponse);
  rpc EndGame(EndGameRequest) returns (EndGameResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc GetRoomState(GetRoomStateRequest) returns (GetRoomStateResponse);
}
